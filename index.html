<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15357D" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="นัดโตะ" />
    <title>นัดโตะ (NATTO) — Demo</title>
    <script>
      // Netlify landing: a desktop visitor opening the site root sees the booth presentation first
      // (also what Netlify's site thumbnail captures). Phones/tablets, the installed app, deep links (#/...)
      // and /index.html (the deck's "back to app" target) always open the app.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var netlify = /\.netlify\.app$/.test(location.hostname) || q.has('netlify-landing-test');
          var root = location.pathname === '/' || (q.has('netlify-landing-test') && /\/$/.test(location.pathname));
          var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
          var desktop = matchMedia('(pointer: fine)').matches && innerWidth >= 1024 &&
            !/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) && !(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          if (netlify && root && !location.hash && !standalone && desktop) location.replace('./presentation.html');
        } catch (e) { /* never block the app */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
