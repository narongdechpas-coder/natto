# Netlify build settings (read automatically when Netlify builds this branch).
# Production branch must be set in the Netlify UI: Site configuration → Build & deploy → Branches and deploy contexts.
[build]
  command = "npm run build"   # Netlify installs dependencies from package-lock.json before this step
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Service worker and manifest must not be cached long, so installed apps pick up new deploys.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build assets can be cached for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Site root serves the booth presentation (also what Netlify's site thumbnail captures).
# presentation.html sends phones, tablets and the installed app on to the app (/index.html).
[[redirects]]
  from = "/"
  to = "/presentation.html"
  status = 200
  force = true
